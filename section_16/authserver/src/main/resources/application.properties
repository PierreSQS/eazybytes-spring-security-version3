spring.application.name=${AS_NAME:authserver}

server.port= ${AS_SERVER_PORT:9000}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

# NOTE: PLEASE START THE DOCKER CONTAINER MYSQL2.4.5 BEFORE RUNNING THE APPLICATION, OTHERWISE IT WILL FAIL.
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3308}/${DATABASE_NAME:eazybankdb}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Galerien3?}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
# Enable SQL Syntax Highlighting in Console
spring.jpa.properties.hibernate.highlight_sql=${HIGHLIGHT_SQL:true}

logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
